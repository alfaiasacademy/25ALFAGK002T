<script>
    const questionsData = [
        { q: "1. கொசு கடியின் மூலம் மனித உடலில் நுழைந்த பிறகு, மலேரியா ஒட்டுண்ணி (பிளாஸ்மோடியம்) ஆரம்ப பெருக்கத்தை எதில் காட்டுகிறது–", options: ["(A) முதுகுத் தண்டு", "(B) இரத்தம்", "(C) கல்லீரல்", "(D) மண்ணீரல்"], ans: "(C)" },
        { q: "2. இரத்தத்தின் பின்வரும் பாகங்களில் எது உடல் பாதுகாப்பு செயல்பாட்டைச் செய்கிறது?", options: ["(A) பிளேட்லெட்டுகள்", "(B) இரத்த வெள்ளை அணுக்கள்", "(C) ஹீமோகுளோபின்", "(D) சிவப்பு இரத்த அணுக்கள்"], ans: "(B)" },
        { q: "3. போலியோ நோய் இதனால் ஏற்படுகிறது–", options: ["(A) பாக்டீரியா", "(B) பூஞ்சை", "(C) வைரஸ்", "(D) புழு"], ans: "(C)" },
        { q: "4. பின்வருவனவற்றில் நமது உடலின் கடினமான பகுதி எது?", options: ["(A) தலையின் மண்டை ஓடு எலும்புகள்", "(B) கட்டைவிரல் நகங்கள்", "(C) பற்களின் பற்சிப்பி", "(D) முதுகெலும்பு முதுகெலும்பு"], ans: "(C)" },
        { q: "5. பின்வரும் குழுக்களில் எந்த குழு விலங்கு செல்களில் உள்ளது?", options: ["(A) மைட்டோகாண்ட்ரியா, செல் சவ்வு, செல் சுவர், சைட்டோபிளாசம்", "(B) குளோரோபிளாஸ்ட்கள், சைட்டோபிளாசம், வெற்றிடம், கரு", "(C) கரு, செல் சவ்வு, மைட்டோகாண்ட்ரியா, சைட்டோபிளாசம்", "(D) வெற்றிடம், செல் சவ்வு, கரு, மைட்டோகாண்ட்ரியா"], ans: "(C)" },
        { q: "6. கார்பெட் தேசிய பூங்கா உத்தராஞ்சலின் எந்த மாவட்டத்தில் அமைந்துள்ளது?", options: ["(A) சாமோலி", "(B) நைனிடால்", "(C) ரிஷிகேஷ்", "(D) கர்வால்"], ans: "(B)" },
        { q: "7. இணைப்பிற்கான 'இணைத்தல் மற்றும் விரட்டல்' என்ற கருதுகோளை உருவாக்கியவர்—", options: ["(A) சட்டன் மற்றும் போவேரி", "(B) பேட்சன் & புன்னெட்", "(C) T.H. மோர்கன்", "(D) W. சட்டன்"], ans: "(B)" },
        { q: "8. பாலனோக்ளோசஸ் பொதுவாக எவ்வாறு அறியப்படுகிறது?", options: ["(A) மண்புழு", "(B) நாடாப்புழு", "(C) சோளப் புழு", "(D) நாக்கு புழு"], ans: "(D)" },
        { q: "9. டிரோசோபிலாவில், பாலின நிர்ணயம் எதனைச் சார்ந்துள்ளது?", options: ["(A) Y-குரோமோசோம்", "(B) X-குரோமோசோம்", "(C) ஆட்டோசோம்", "(D) X-குரோமோசோம் & ஆட்டோசோம் இரண்டும்"], ans: "(D)" },
        { q: "10. அறிவற்ற கோடன்கள்—", options: ["(A) AUG, AAU, UAG", "(B) GGU, AGU, AUG", "(C) UAG, UAA, UGA", "(D) GAU, AAU, GUA"], ans: "(C)" },
        { q: "11. சென்ட்ரோமியர் எந்த நிலையில் இரண்டாகப் பிரிகிறது?", options: ["(A) மெட்டாஃபேஸ்-I", "(B) ப்ரோஃபேஸ்-I", "(C) மெட்டாஃபேஸ்-II", "(D) அனாஃபேஸ்-II"], ans: "(D)" },
        { q: "12. எந்த விலங்கு முட்டையிடும் பாலூட்டியாக உள்ளது ?", options: ["(A) டிடெல்ஃபிஸ்", "(B) மேக்ரோபஸ்", "(C) டெரோபஸ்", "(D) டாக்கிக்ளோசஸ்"], ans: "(D)" },
        { q: "13. பறவையின் வாலில் எண்ணெய் உற்பத்தி செய்யும் சுரப்பி —", options: ["(A) ப்ரீன் சுரப்பி", "(B) சளி சுரப்பி", "(C) பச்சை சுரப்பி", "(D) செபாசியஸ் சுரப்பி"], ans: "(A)" },
        { q: "14. பின்வரும் இணைகளில் எது சரியாகப் பொருந்துகிறது?\nI. பஹாரியா பழங்குடியினர் -- ஜார்கண்ட்\nII. முண்டா பழங்குடியினர் -- ஜார்கண்ட்\nIII. பில் பழங்குடியினர் -- மகாராஷ்டிரா\nIV. ராமோசி பழங்குடியினர் -- மகாராஷ்டிரா & மத்திய பிரதேசம்", options: ["(A) I & II", "(B) I, II & III", "(C) II, III & IV", "(D) அனைத்தும் சரி"], ans: "(D)" },
        { q: "15. ஆண் பல்லியின் தொடைகளின் கீழ் மேற்பரப்பில் காணப்படும் சுரப்பி?", options: ["(A) சுடோரிஃபிக் சுரப்பி", "(B) தொடை சுரப்பி", "(C) பச்சை சுரப்பி", "(D) துர்நாற்ற சுரப்பி"], ans: "(B)" },
        { q: "16. பின்வருவனவற்றில் எது பாதை ஃபிளாஜெல்லேட் அல்ல?", options: ["(A) லீஷ்மேனியா", "(B) ஜியார்டியா", "(C) டிரிபனோசோமா", "(D) நோக்டிலுகா"], ans: "(D)" },
        { q: "17. யூனியோவின் குளோச்சிடியம் புழு—", options: ["(A) சுதந்திரமாக நீந்தும் தன்மை கொண்டது", "(B) மீனில் எக்டோபராசைட்", "(C) மீனில் எண்டோபராசைட்", "(D) அடிப்பகுதியில் வாழும்"], ans: "(B)" },
        { q: "18. ‘பிளாஸ்மலெம்மா’ என்ற சொல்லை வழங்கியவர்—", options: ["(A) C. நாகேலி & C. கிராமர்", "(B) J.Q. உழவு", "(C) டான்சில்லி & டேவ்சன்", "(D) ராபர்ட்சன்"], ans: "(B)" },
        { q: "19. மென்மையான எண்டோபிளாஸ்மிக் ரெட்டிகுலம் செயல்படுத்துவது—\n1. லிப்பிடுகளைத் தொகுப்பதை\n2. கிளைகோஜெனோலிசிஸ்\n3. ஸ்டெரால் வளர்சிதை மாற்றத்தை\n4. நச்சு நீக்கத்தை", options: ["(A) 4 மட்டுமே சரியானது", "(B) 1 மற்றும் 2 இரண்டும் சரியானது", "(C) 2 மற்றும் 3 இரண்டும் சரியானது", "(D) அனைத்தும் சரியானது"], ans: "(D)" },
        { q: "20. பறவைகளில் முட்டையில் உட்புற அடுக்கில் உள்ள ஆல்புமென் எவ்வாறு அழைக்கப்படுகிறது?", options: ["(A) உள் மெல்லிய ஆல்புமின்", "(B) வைட்டலின் சவ்வு", "(C) அடர்த்தியான ஆல்புமின்", "(D) சலாசிஃபெரஸ் அடுக்கு"], ans: "(B)" },
        { q: "21. கனிஷ்கரின் காலத்தின் பின்வரும் கல்வெட்டுகளில் எது அவரது பேரரசு கிழக்கில் சம்பா வரை நீட்டிக்கப்பட்டது என்பதைக் குறிக்கிறது?", options: ["(A) சாரநாத் கல்வெட்டு", "(B) சாஹேத்-மகேத் கல்வெட்டு", "(C) ரபடக கல்வெட்டு", "(D) மேற்கூறியவை எதுவுமில்லை"], ans: "(A)" },
        { q: "22. மத்திய ஆசியாவின் புகழ்பெற்ற 'பட்டுப்பாதையை' யார் கைப்பற்றினர்?", options: ["(A) அசோகர்", "(B) கனிஷ்கர்", "(C) மெனாண்டர்", "(D) ஹர்ஷா"], ans: "(B)" },
        { q: "23. பின்வரும் கூற்றுகளைக் கருத்தில் கொண்டு கீழே கொடுக்கப்பட்டுள்ள குறியீட்டிலிருந்து சரியான பதிலைத் தேர்ந்தெடுக்கவும்—\nகூற்று (A) : பச்சனாலியன் காட்சிகள் மதுரா கலையிலும் காணப்படுகின்றன.\nகாரணம் (R) : மதுரா கலைஞர்கள் காந்தார கலை மரபை அறிந்திருந்தனர்.", options: ["(A) (A) மற்றும் (R) இரண்டும் உண்மை மற்றும் (R) என்பது (A) இன் சரியான விளக்கம்", "(B) (A) மற்றும் (R) இரண்டும் ture, ஆனால் (R) என்பது (A) இன் சரியான விளக்கம் அல்ல", "(C) (A) உண்மை, ஆனால் (R) தவறு", "(D) (A) தவறு, ஆனால் (R) உண்மை"], ans: "(D)" },
        { q: "24. சந்திரகுப்த மௌரியரின் ஆட்சிக் காலத்தில் 'கோபா' என்று அழைக்கப்பட்ட அதிகாரியின் செயல்பாடு என்ன?", options: ["(A) அவர் ஒரு ஜனபதத்தின் பொறுப்பாளராக இருந்தார்", "(B) அவர் ஒரு கிராமக் குழுவின் பொறுப்பாளராக இருந்தார்", "(C) அவர் ஒரு துரோணமுகரின் பொறுப்பாளராக இருந்தார்", "(D) அவர் ஒரு நகராட்சி வாரியத்தின் தலைவராக இருந்தார்"], ans: "(B)" },
        { q: "25. பின்வரும் மௌரிய தூண்களில் எது சிங்க உருவங்களால் சூழப்பட்டது?\n1. கோலுஹா தூண்\n2. லௌரியா நந்தங்கர் தூண்\n3. சாஞ்சி தூண்\n4. சாரநாத் தூண்", options: ["(A) 1, 2, 3 மற்றும் 4", "(B) 1, 2 மற்றும் 3", "(C) 3 மற்றும் 4", "(D) 2 மற்றும் 3"], ans: "(A)" },
        { q: "26. முகலாயப் பேரரசர் ஔரங்கசீப் எந்த ஆண்டில் இறந்தார்?", options: ["(A) 1707", "(B) 1701", "(C) 1705", "(D) 1703"], ans: "(A)" },
        { q: "27. பின்வருவனவற்றின் சரியான காலவரிசை வரிசை என்ன?\nI. காந்தி-இர்வின் ஒப்பந்தம்\nII. நேரு அறிக்கை\nIII. ஒத்துழையாமை இயக்கம்\nIV. வெள்ளையனே வெளியேறு இயக்கம்", options: ["(A) III, IV, I, II", "(B) III, II, I, IV", "(C) II, III, IV, I", "(D) II, III, I, IV"], ans: "(B)" },
        { q: "28. பிரிட்டிஷ் அரசாங்கத்தால் இந்தியாவில் நியமிக்கப்பட்டதன் அடிப்படையில் பின்வரும் நபர்களின் சரியான காலவரிசை வரிசை என்ன?\nI. லார்ட் மிண்டோ\nII. லார்ட் ரீடிங்\nIII. லார்ட் கர்சன்\nIV. லார்ட் இர்வின்", options: ["(A) II, III, I, IV", "(B) IV, I, III, II", "(C) I, III, II, IV", "(D) III, I, II, IV"], ans: "(D)" },
        { q: "29. சுதந்திர இந்தியாவின் முதல் கவர்னர் ஜெனரல் யார்?", options: ["(A) லார்ட் மவுண்ட்பேட்டன்", "(B) சி.ராஜகோபாலாச்சாரி", "(C) பண்டிட் ஜவஹர்லால் நேரு", "(D) பாபு ராஜேந்திர பிரசாத்"], ans: "(A)" },
        { q: "30. பின்வரும் வேதங்களில் எது மந்திர பாடல்கள் மற்றும் சூனியம் பற்றி கையாள்கிறது?", options: ["(A) ரிக்வேதம்", "(B) சாமவேதம்", "(C) யஜுர்வேதம்", "(D) அதர்வவேதம்"], ans: "(D)" },
        { q: "31. பிந்தைய வேத காலம் என்பது எதை தொகுத்த காலத்தை குறிக்கிறது?", options: ["(A) சம்ஹிதைகள்", "(B) பிராமணங்கள்", "(C) ஆரண்யகங்கள்", "(D) மேலே உள்ள அனைத்தும்"], ans: "(D)" },
        { q: "32. I.M.A. (இந்திய இராணுவ அகாடமி) எங்கே அமைந்துள்ளது?", options: ["(A) டேராடூன்", "(B) பித்தோராகர்", "(C) உதம் சிங் நகர்", "(D) அல்மோரா"], ans: "(A)" },
        { q: "33. லால் பகதூர் சாஸ்திரி அகாடமி எங்கே அமைந்துள்ளது?", options: ["(A) டேராடூன்", "(B) முசோரி", "(C) நைனிடால்", "(D) அல்மோரா"], ans: "(B)" },
        { q: "34. வேத மதமும் அதன் பிற்கால (வேத) வளர்ச்சிகளுடன் சேர்த்து உண்மையில் எவ்வாறு கூறப்படுகிறது?", options: ["(A) இந்து மதம்", "(B) பிராமணியம்", "(C) பகவதியம்", "(D) வேத தர்மம்"], ans: "(B)" },
        { q: "35. சிப்கோ இயக்கம் எதனுடன் தொடர்புடையது?", options: ["(A) வனப் பாதுகாப்பு", "(B) வனவிலங்கு பாதுகாப்பு", "(C) காற்றுப் பாதுகாப்பு", "(D) நீர்ப் பாதுகாப்பு"], ans: "(A)" },
        { q: "36. வேத கால ஆரியர்கள் முதலில் எங்கு குடியேறினர்?", options: ["(A) மத்திய இந்தியா", "(B) கங்கை தோவாப்", "(C) சப்தசிந்து", "(D) காஷ்மீர் மற்றும் பஞ்சாப்"], ans: "(C)" },
        { q: "37. பின்வருவனவற்றில் எதில் பிரபலமான காயத்ரி மந்திரம் அடங்கியுள்து?", options: ["(A) ரிக்வேதம்", "(B) சாமவேதம்", "(C) கதோபநிஷதம்", "(D) ஐதரேய பிராமணம்"], ans: "(A)" },
        { q: "38. புகழ்பெற்ற காயத்ரி மந்திரம் எந்த கடவுளுக்காக கூறப்படுகிறது?", options: ["(A) இந்திரன்", "(B) வருணன்", "(C) பசுபதி", "(D) சவிதா"], ans: "(D)" },
        { q: "39. வேத மதத்தில் இரண்டு உயர்ந்த கடவுள்கள்", options: ["(A) அக்னி மற்றும் சாவித்ரி", "(B) விஷ்ணு மற்றும் மித்ரா", "(C) இந்திரன் மற்றும் வருணன்", "(D) சூரியன் மற்றும் பூஷன்"], ans: "(C)" },
        { q: "40. வேதகால சமூகத்தை நான்கு வகுப்புகளாகப் பிரிப்பது பற்றி எதில் கூறப்பட்டுள்ளது?", options: ["(A) யஜுர்வேதத்தில்", "(B) ரிக்வேதத்தின் புருஷ-சூக்தம்", "(C) உபநிஷதங்கள்", "(D) சதபத பிராமணம்"], ans: "(B)" },
        { q: "41. P மற்றும் Q முறையே ரூ.85,000 மற்றும் ரூ.15,000 முதலீடு செய்து ஒரு தொழிலைத் தொடங்கினர். 2 ஆண்டுகளுக்குப் பிறகு ஈட்டிய லாபம் எந்த விகிதத்தில் அவர்களுக்கு இடையே பிரிக்கப்படும்?", options: ["(A) 3 : 4", "(B) 15 : 23", "(C) 17 : 23", "(D) 17 : 3"], ans: "(D)" },
        { q: "42. கமல் ரூ.9,000 முதலீடு செய்து ஒரு தொழிலைத் தொடங்கினார். ஐந்து மாதங்களுக்குப் பிறகு, சமீர் ரூ.8,000 மூலதனத்துடன் சேர்ந்தார். ஆண்டின் இறுதியில், அவர்கள் ரூ.6,970 லாபம் ஈட்டினால், லாபத்தில் சமீரின் பங்கு என்னவாக இருக்கும்?", options: ["(A) ரூ.1883.78", "(B) ரூ.2380", "(C) ரூ.3690", "(D) ரூ.1913"], ans: "(B)" },
        { q: "43. 4 (A இன் மூலதனம்) = 6 (B இன் மூலதனம்) = 10 (C இன் மூலதனம்) எனில், ரூ.4,650 லாபத்தில், C பெறுவது.", options: ["(A) ரூ.465", "(B) ரூ.900", "(C) ரூ.1550", "(D) ரூ.2250"], ans: "(B)" },
        { q: "44. 36 ஆண்கள் ஒரு வேலையை 18 நாட்களில் முடிக்க முடியும். 27 ஆண்கள் அதே வேலையை எத்தனை நாட்களில் முடிக்க முடியும்?", options: ["(A) 12", "(B) 18", "(C) 22", "(D) 24"], ans: "(D)" },
        { q: "45. 12 ஆண்கள் ஒரு நாளைக்கு 8 மணி நேரம் வேலை செய்து ஒரு வேலையை 10 நாட்களில் முடிக்கிறார்கள். ஒரு நாளைக்கு 15 மணி நேரம் வேலை செய்தால், அதே வேலையை 8 நாட்களில் முடிக்க எத்தனை ஆண்கள் தேவைப்படுவார்கள் ?", options: ["(A) 4", "(B) 5", "(C) 6", "(D) 8"], ans: "(D)" },
        { q: "46. ஒரு கயிறு 14 செ.மீ அடிப்பகுதி ஆரம் கொண்ட ஒரு உருளையின் சுற்றளவை 70 சுற்றுகளாக மாற்றுகிறது. அந்த கயிறைக் கொண்டு 20 செ.மீ ஆரம் கொண்ட ஒரு உருளையை எத்தனை முறை சுற்ற முடியும்?", options: ["(A) 40", "(B) 49", "(C) 100", "(D) 120"], ans: "(B)" },
        { q: "47. 3 ஆண்கள் அல்லது 6 சிறுவர்கள் ஒரு நாளைக்கு 7 மணிநேரம் வேலை செய்து 10 நாட்களில் ஒரு வேலையைச் செய்ய முடிந்தால்; 6 ஆண்கள் மற்றும் 2 சிறுவர்கள் ஒரு நாளைக்கு 8 மணிநேரம் ஒன்றாக வேலை செய்து இரண்டு மடங்கு பெரிய வேலையை முடிக்க எத்தனை நாட்கள் ஆகும்?", options: ["(A) 6", "(B) 7 1/2", "(C) 8 1/2", "(D) 9"], ans: "(B)" },
        { q: "48. A ஒரு வேலையை 10 நாட்களில் செய்ய முடியும், B அதே வேலையை 15 நாட்களில் செய்ய முடியும். அவர்கள் ஒன்றாக வேலை செய்து எத்தனை நாட்களில் வேலையை முடிக்க முடியும்?", options: ["(A) 5", "(B) 6", "(C) 8", "(D) 9"], ans: "(B)" },
        { q: "49. A மற்றும் B ஒரு வேலையை 12 நாட்களிலும், B மற்றும் C 15 நாட்களிலும், C மற்றும் A 20 நாட்களிலும் செய்ய முடியும். A, B & C இணைந்து வேலை செய்தால், அவர்கள் வேலையை முடிப்பார்கள்", options: ["(A) 5", "(B) 7 5/6", "(C) 10", "(D) 15 2/3"], ans: "(C)" },
        { q: "50. A மற்றும் B என்ற இரண்டு குழாய்கள் முறையே 15 நிமிடங்களிலும் 20 நிமிடங்களிலும் ஒரு தொட்டியை நிரப்ப முடியும். இரண்டு குழாய்களும் ஒன்றாகத் திறக்கப்படுகின்றன, ஆனால் 4 நிமிடங்களுக்குப் பிறகு, குழாய் A மூடப்படுகிறது. எனில் தொட்டியை நிரப்ப தேவையான மொத்த நேரம் எவ்வளவு?", options: ["(A) 10 நிமிடங்கள், 20 வினாடிகள்", "(B) 11 நிமிடங்கள், 45 வினாடிகள்", "(C) 12 நிமிடங்கள், 30 வினாடிகள்", "(D) 14 நிமிடங்கள், 40 வினாடிகள்"], ans: "(D)" },
        { q: "51. பின்வரும் கூற்றுகளை கவனியுங்கள்–\nபஞ்சாயத்துகளின் நிதி நிலையை மறுஆய்வு செய்வதற்கு மாநில அரசால் நியமிக்கப்படும் நிதி ஆணையம் எதைப்பற்றிய பரிந்துரைகளை வழங்குகிறதூ?\n1. மாநிலங்களால் விதிக்கப்படும் வரிகள், சுங்கவரி மற்றும் கட்டணங்களின் நிகர வருமானத்தை மாநிலத்திற்கும் பஞ்சாயத்துகளுக்கும் இடையில் விநியோகிப்பது குறித்து\n2. பஞ்சாயத்துகளுக்கு ஒதுக்கக்கூடிய வரிகள், கடமைகள், சுங்கவரி மற்றும் கட்டணங்களை நிர்ணயிப்பது குறித்து\n3. பஞ்சாயத்துகளுக்கு மானிய உதவியை தீர்மானிக்கும் கொள்கைகள் குறித்து", options: ["(A) 1 மட்டும்", "(B) 2 மற்றும் 3 மட்டும்", "(C) 1 மற்றும் 3 மட்டும்", "(D) 1, 2 மற்றும் 3"], ans: "(D)" },
        { q: "52. பின்வரும் நினைவுச்சின்னங்களில் எது முன்னர் 'அகில இந்திய போர் நினைவுச்சின்னம்' என்று அழைக்கப்பட்டது?", options: ["(A) இந்தியாவின் நுழைவாயில்", "(B) இந்தியா கேட்", "(C) சார்மினார்", "(D) லால் குய்லா"], ans: "(B)" },
        { q: "53. இந்திய அரசியலமைப்பின் முகவுரை தொடர்பான பின்வரும் கூற்றுகளில் எது சரியானது?\n1. முகவுரை அரசியலமைப்பின் ஒருங்கிணைந்த பகுதியாகும்.\n2. 'மதச்சார்பற்ற' மற்றும் 'சோசலிஸ்ட்' என்ற சொற்கள் அதன் தொடக்கத்திலிருந்தே முகவுரையின் ஒரு பகுதியாக இருந்து வருகின்றன.", options: ["(A) 1 மட்டும்", "(B) 2 மட்டும்", "(C) 1 மற்றும் 2 இரண்டும்", "(D) 1 அல்லது 2 அல்ல"], ans: "(A)" },
        { q: "54. பொதுவாக பாராளுமன்றம் இதில் பட்டியலிடப்பட்டுள்ள பொருண்மைகள் குறித்து சட்டம் இயற்றலாம்–", options: ["(A) யூனியன் பட்டியல்", "(B) உடன்கட்டையான பட்டியல்", "(C) மாநில பட்டியல்", "(D) யூனியன் மற்றும் உடன்கட்டையான பட்டியல்"], ans: "(D)" },
        { q: "55. ஹோம் ரூல் இயக்கம் தொடர்பான பின்வரும் கூற்றுகளில் எது சரியானது அல்ல?", options: ["(A) 1917 இல் அதன் பெரும் முன்னேற்றத்திற்குப் பிறகு முன்னேறுவதற்குப் பதிலாக, இயக்கம் 1918 இல் படிப்படியாகக் குறைந்தது", "(B) இயக்கத்தின் தலைவரான அன்னி பெசன்ட், தீவிரவாதிகளின் இயக்கத்தில் இணைவதை எதிர்க்கவில்லை", "(C) தேசியவாதத் தலைவர்களிடையே தொடர்ச்சியான கருத்து வேறுபாடுகள் காரணமாக இயக்கம் மேலும் மேலும் பலவீனமடைந்தது", "(D) இயக்கம் மீண்டும் மகாத்மா காந்தியால் புத்துயிர் பெற்றது"], ans: "(D)" },
        { q: "56. காந்திஜி ஏன் சம்பாரண் சென்றார்?", options: ["(A) சர்யாக்கிரக இயக்கத்தைத் தொடங்க", "(B) ஒத்துழையாமை இயக்கத்தைத் தொடங்க", "(C) இண்டிகோ விவசாயிகளின் குறைகளை விசாரிக்க", "(D) ஜமீன்தார்களுக்கு எதிராகப் போராட"], ans: "(C)" },
        { q: "57. பின்வருவனவற்றில் எது ஆங்கிலேயர்களுக்கும் பிரெஞ்சுக்காரர்களுக்கும் இடையிலான முதல் கர்நாடகப் போருக்கு அடிப்படைக் காரணமாக இருந்தது?", options: ["(A) கர்நாடகாவின் பூர்வீக அரசியலில் ஆங்கிலேயர்களும் பிரெஞ்சுக்காரர்களும் பங்கேற்றது", "(B) தெற்கிலிருந்து ஆங்கிலேயர்களை விரட்டியடிக்க டூப்ளேயின் லட்சியம்", "(C) ஆங்கிலேயர்களுக்கும் பிரெஞ்சுக்காரர்களுக்கும் இடையிலான வர்த்தகப் போட்டி", "(D) ஆஸ்திரிய வாரிசுரிமைப் போர், இதன் காரணமாக பிரிட்டனும் பிரான்சும் உலகின் ஒவ்வொரு பகுதியிலும் ஒருவருக்கொருவர் எதிரிகளாக மாறின"], ans: "(D)" },
        { q: "58. குப்தர் ஆட்சிக் காலத்தில் பட்டுத் துணிகளை உற்பத்தி செய்வதில் சிறந்த நகரமாக இருந்த நகரம் எது?", options: ["(A) பாடலிபுத்திரம்", "(B) முர்ஷிதாபாத்", "(C) காசிபூர்", "(D) வாரணாசி"], ans: "(B)" },
        { q: "59. அஜந்தாவில் உள்ள குகை ஓவியங்களைப் பற்றி பின்வருவனவற்றில் எது சரியானதல்ல?", options: ["(A) காட்சிகள் பிரிக்கும் சட்டகத்தைக் கொண்டிருக்கவில்லை மற்றும் ஒன்றோடொன்று கலக்கின்றன", "(B) காட்சிகள் மத மற்றும் மதச்சார்பற்ற தன்மை கொண்டவை", "(C) காந்தார கலையின் செல்வாக்கு காணப்படுகிறது", "(D) காட்சிகள் பெரும்பாலும் ஜாதகக் கதைகளை சித்தரிக்கின்றன"], ans: "(C)" },
        { q: "60. இந்தியக் துணைக் குடியரசுத் தலைவரைத் தேர்வு செய்யும் தேர்வுக் குழுவில் (Electoral College) உள்ளவர்கள்–", options: ["(A) நாடாளுமன்றத்தின் இரு அவைகளின் உறுப்பினர்கள்", "(B) மாநிலங்களவை உறுப்பினர்கள் மட்டும்", "(C) நாடாளுமன்றத்தின் இரு அவைகளின் தேர்ந்தெடுக்கப்பட்ட உறுப்பினர்கள்", "(D) மக்களவையின் தேர்ந்தெடுக்கப்பட்ட உறுப்பினர்கள் மட்டும்"], ans: "(A)" },
        { q: "61. 20% ஆல்கஹால் கலந்த 5 லிட்டர் தண்ணீர் கரைசலில் ஒரு லிட்டர் தண்ணீர் சேர்க்கப்படுகிறது. புதிய கரைசலில் உள்ள ஆல்கஹால் வலிமை __", options: ["(A) 16 2/3%", "(B) 15%", "(C) 20%", "(D) 16%"], ans: "(A)" },
        { q: "62. 12 பொருட்களின் விலை 10 பொருட்களின் விற்பனை விலைக்கு சமமாக இருந்தால். பரிவர்த்தனையில் லாப சதவீதம் ___", options: ["(A) 18", "(B) 16 2/3%", "(C) 20%", "(D) 25%"], ans: "(C)" },
        { q: "63. P மற்றும் Q இன் தற்போதைய வயதுகளுக்கு இடையிலான வேறுபாடு 8 ஆண்டுகள் மற்றும் அவர்களின் வயதுகளின் விகிதம் முறையே 2: 3 ஆகும். P இன் தற்போதைய வயது என்ன?", options: ["(A) 16 ஆண்டுகள்", "(B) 24 ஆண்டுகள்", "(C) 12 ஆண்டுகள்", "(D) 30 ஆண்டுகள்"], ans: "(A)" },
        { q: "64. குழந்தைகளில் புரதக் குறைபாட்டால் ஏற்படும் நோய் எது?", options: ["(A) மராஸ்மாஸ்", "(B) பெல்லாக்ரா", "(C) பெரி-பெரி", "(D) ரிக்கெட்ஸ்"], ans: "(A)" },
        { q: "65. நர்மதா பச்சாவ் அந்தோலனில் உழைத்ததற்காக எந்த இந்திய சமூக ஆர்வலர் மிகவும் பிரபலமானவர்?", options: ["(A) மேனகா காந்தி", "(B) சாந்தா சின்ஹா", "(C) கிரண் பேடி", "(D) மேதா பட்கர்"], ans: "(D)" },
        { q: "66. ராஜீவ் காந்தி கேல் ரத்னா விருதை (இப்போது மேஜர் தியான் சந்த் கேல் ரத்னா விருது என மறுபெயரிடப்பட்டது) பெற்ற முதல் நபர் யார்?", options: ["(A) சச்சின் டெண்டுல்கர்", "(B) விஸ்வநாதன் ஆனந்த்", "(C) கீத் சேத்தி", "(D) தன்ராஜ் பிள்ளை"], ans: "(B)" },
        { q: "67. டைக்ரோமேட் கரைசலுடன் அமிலப் படுத்தப்பட்ட இரும்பு அம்மோனியம் சல்பேட்டை ஆக்சிஜனேற்றம் செய்யும் போது", options: ["(A) குரோமியம் மற்றும் இரும்பின் ஆக்சிஜனேற்ற எண் முறையே +6 இலிருந்து +3 ஆகவும் +3 லிருந்து +2 ஆகவும் மாறுகிறது.", "(B) குரோமியம் மற்றும் இரும்பின் ஆக்சிஜனேற்ற எண் முறையே +3 இலிருந்து +6 ஆகவும் +3 லிருந்து +2 ஆகவும் மாறுகிறது.", "(C) குரோமியம் மற்றும் இரும்பின் ஆக்சிஜனேற்ற எண் முறையே +6 இலிருந்து +3 ஆகவும் +2 லிருந்து +3 ஆகவும் மாறுகிறது.", "(D) குரோமியம் மற்றும் இரும்பின் ஆக்சிஜனேற்ற எண் முறையே +2 இலிருந்து +3 ஆகவும் +6 ஆகவும் +3 ஆகவும் மாறுகிறது."], ans: "(C)" },
        { q: "68. பின்வரும் கூற்றுகளைக் கவனியுங்கள்:\nகூற்று (A) : தாமிரம் முக்கியமாக மின் பொறியியல் துறையில் பயன்படுத்தப்படுகிறது.\nகாரணம் (R) : தாமிரம் அதிக கடத்துத்திறன் கொண்டது.", options: ["(A) (A) மற்றும் (R) இரண்டும் சரியானவை மற்றும் (R) (A) ஐ சரியாக விளக்குகின்றன.", "(B) (A) மற்றும் (R) இரண்டும் சரியானவை மற்றும் (R) (A) ஐ விளக்கவில்லை.", "(C) (A) உண்மை ஆனால் (R) தவறு.", "(D) (A) தவறு ஆனால் (R) உண்மை."], ans: "(A)" },
        { q: "69. பின்வரும் தாவரங்களை அவை வளரும் நிலப்பரப்பின் உயரத்திற்கு ஏற்ப வரிசைப்படுத்துங்கள்.", options: ["(A) தேவதாரு, ஜூனிபர், தேக்கு, மேப்பிள்", "(B) தேவதாரு, ஜூனிபர், மேப்பிள், தேக்கு", "(C) ஜூனிபர், தேக்கு, தேவதாரு, மேப்பிள்", "(D) ஜூனிபர், தேவதாரு, மேப்பிள், தேக்கு"], ans: "(D)" },
        { q: "70. பின்வரும் கூற்றுகளைக் கவனியுங்கள்:\nகூற்று (A) : அடிப்படைக் கடமைகளுக்கு எந்த சட்டப்பூர்வ அனுமதியும் இல்லை\nகாரணம் (R) : அடிப்படைக் கடமைகளை நீதிமன்றங்களால் செயல்படுத்த முடியாது.", options: ["(A) (A) மற்றும் (R) இரண்டும் சரியானவை மற்றும் (R) (A) ஐ சரியாக விளக்குகின்றன.", "(B) (A) மற்றும் (R) இரண்டும் சரியானவை மற்றும் (R) (A) ஐ விளக்கவில்லை.", "(C) (A) உண்மை ஆனால் (R) தவறு.", "(D) (A) தவறு ஆனால் (R) உண்மை."], ans: "(A)" },
        { q: "71. பின்வரும் கூற்றுகளைக் கவனியுங்கள்:\n(A) 73வது அரசியலமைப்புத் திருத்தச் சட்டம் அரசியலமைப்பின் பகுதி IX இல் சில விதிகளைச் செருகுகிறது.\n(B) கிராம மட்டத்திலும் மாவட்டத்தின் உயர் மட்டங்களிலும் பஞ்சாயத்துகளை அமைப்பதற்கான சட்டங்களை உருவாக்க மாநில சட்டமன்றத்திற்கு இது அதிகாரம் அளிக்கிறது.", options: ["(A) (A) மற்றும் (B) இரண்டும் உண்மை.", "(B) (A) மற்றும் (B) இரண்டும் உண்மையல்ல.", "(C) (A) மட்டுமே உண்மை", "(D) (B) மட்டுமே உண்மை"], ans: "(D)" },
        { q: "72. முதல் தனிப்பட்ட சத்தியாக்கிரகி", options: ["(A) காந்திஜி", "(B) வினோபா பாவே", "(C) ராஜாஜி", "(D) எம்.ஏ.ஜின்னா"], ans: "(B)" },
        { q: "73. பின்வரும் எந்த காங்கிரஸ் கூட்டத்தொடருக்கு ஐரிஷ் உறுப்பினர் ஆல்ஃபிரட் வெப் தலைமை தாங்கினார்?", options: ["(A) முதல் அமர்வு 1885", "(B) நான்காவது அமர்வு 1888", "(C) ஏழாவது அமர்வு 1891", "(D) பத்தாவது அமர்வு 1894"], ans: "(D)" },
        { q: "74. “பந்தே மாதரம்” என்ற ஆய்வறிக்கையின் முதல் ஆசிரியர்", options: ["(A) பங்கிம் சந்திர சாட்டர்ஜி", "(B) ஸ்ரீ அரவிந்தோ கோஷ்", "(C) ரவீந்திரநாத் தாகூர்", "(D) டாக்டர் அன்னி பெசன்ட்"], ans: "(B)" },
        { q: "75. A, B மற்றும் C ஆகியவற்றுக்கு இடையே ரூ.680 என்ற தொகையை A க்கு B ஐ விட 3 மடங்கு அதிகமாகவும் B க்கு C ஐ விட 4 மடங்கு அதிகமாக இருப்பது போலவும் பிரிக்கவும்.", options: ["(A) ரூ.160, ரூ.40, ரூ.480", "(B) ரூ.480, ரூ.160, ரூ.40", "(C) ரூ.480, ரூ.40, ரூ.160", "(D) ரூ.160, ரூ.480, ரூ.40"], ans: "(B)" },
        { q: "76. ஒரு அறையின் நீளம், அகலம் மற்றும் உயரம் முறையே 12 மீட்டர், 9 மீட்டர் மற்றும் 6 மீட்டர் ஆகும். ஒவ்வொரு பெட்டியின் பக்கமும் 1.5 மீட்டர் என்றால் அறையை நிரப்ப எத்தனை கனசதுரப் பெட்டிகள் தேவை?", options: ["(A) 1072", "(B) 648", "(C) 324", "(D) 192"], ans: "(D)" },
        { q: "77. இந்தியாவின் அளவீட்டு தரநிலை ஆய்வகம் எது?", options: ["(A) இந்திய அறிவியல் நிறுவனம்", "(B) தேசிய வான்வெளி ஆய்வகங்கள்", "(C) தேசிய இயற்பியல் ஆய்வகம்", "(D) தேசிய உலோகவியல் ஆய்வகம்"], ans: "(C)" },
        { q: "78. பட்டியல் I ஐ பட்டியல் II உடன் பொருத்தவும்.\nபட்டியல் I (பாறை வகை):\n(a) ரியோலைட் (b) கூட்டு (c) ஸ்லேட் (d) டோலமைட்\nபட்டியல் II (பாறை வகுப்பு):\n(1) சுண்ணாம்பு படிவு (2) இலை வடிவ உருமாற்றம் (3) அரினேசிய படிவு (4) வெளிப்புற தீப்பொறி\nகுறியீடுகள்: a b c d", options: ["(A) 4 3 1 2", "(B) 1 2 4 3", "(C) 4 3 2 1", "(D) 3 2 1 4"], ans: "(C)" },
        { q: "79. பட்டியல் I ஐ பட்டியல் II உடன் பொருத்தவும்.\nபட்டியல் I:\n(A) டச்சு கிழக்கிந்திய நிறுவனம் (B) பிரிட்டிஷ் கிழக்கிந்திய நிறுவனம் (C) பிரெஞ்சு கிழக்கிந்திய நிறுவனம் (D) போர்த்துகீசியர்கள் கோவாவைக் கைப்பற்றினர்\nபட்டியல் II:\n(1) 1600 (2) 1664 (3) 1510 (4) 1602\nகுறியீடுகள்: a b c d", options: ["(A) 2 1 4 3", "(B) 4 1 2 3", "(C) 3 4 2 1", "(D) 1 3 4 2"], ans: "(B)" },
        { q: "80. பின்வரும் கூற்றுகளைக் கவனியுங்கள்:\nகூற்று (A) : இந்திய பொதுத்துறை ஒரு நல்ல தொழில்துறை தளத்தை வளர்ப்பதற்கு உதவியது.\nகாரணம் (R) : பொதுத்துறை மாநில தகவல் பொருத்தமான கொள்கைகளின் கீழ் உள்ளது மற்றும் நிதி மற்றும் பிற ஆதரவை வழங்குவதன் மூலம் பொதுத்துறைக்கு உதவியுள்ளது.", options: ["(A) (A) உண்மை ஆனால் (R) தவறு.", "(B) (A) மற்றும் (R) இரண்டும் சரி", "(C) (A) தவறு ஆனால் (R) உண்மை.", "(D) (A) மற்றும் (R) இரண்டும் தவறு"], ans: "(B)" },
        { q: "81. பின்வரும் அணு மின் நிலையங்களில் எது முற்றிலும் உள்நாட்டிலேயே கட்டப்பட்டது?", options: ["(A) கல்பாக்கம்", "(B) நரோரா", "(C) ராவத் பட்டா", "(D) தாராபூர்"], ans: "(A)" },
        { q: "82. கிராண்ட் டிரங்க் நெடுஞ்சாலையால் எந்த இடங்கள் இணைக்கப்பட்டுள்ளன?", options: ["(A) கொல்கத்தா-அமிர்தசரஸ்", "(B) கொல்கத்தா - மும்பை", "(C) டெல்லி - மும்பை", "(D) டெல்லி - சென்னை"], ans: "(A)" },
        { q: "83. பின்வரும் இந்திய மாநிலங்களில் எது அதிக பழுப்பு நிலக்கரி இருப்புகளைக் கொண்டுள்ளது?", options: ["(A) தமிழ்நாடு", "(B) ராஜஸ்தான்", "(C) ஜம்மு மற்றும் காஷ்மீர்", "(D) குஜராத்"], ans: "(A)" },
        { q: "84. பின்வரும் நாடுகளில் எது உலகின் மிகப்பெரிய மைக்கா உற்பத்தியாளர்?", options: ["(A) இந்தியா", "(B) ரஷ்யா", "(C) இந்தோனேசியா", "(D) பிலிப்பியன்ஸ்"], ans: "(A)" },
        { q: "85. குஜராத் மற்றும் மகாராஷ்டிரா ஆகியவை எந்த மாநிலத்திலிருந்து பிரிக்கப்பட்டுள்ளன?", options: ["(A) பம்பாய்", "(B) குஜராத்", "(C) அகமதாபாத்", "(D) மகாராஷ்டிரா"], ans: "(A)" },
        { q: "86. பாகீரதி நதி எந்த இடத்தில் மந்தாகினியுடன் கலக்கிறது?", options: ["(A) ருத்ர பிரயாக்", "(B) தெஹ்ரி", "(C) தேவ் பிரயாக்", "(D) ரிஷிகேஷ்"], ans: "(C)" },
        { q: "87. ஜவஹர்லால் நேரு மலையேற்றப் பயிற்சி நிறுவனம் எங்கே உள்ளது?", options: ["(A) டேராடூன்", "(B) உத்தர காசி", "(C) சாமோலி", "(D) பாகேஷ்வர்"], ans: "(C)" },
        { q: "88. டிபன் டாப் எங்கே அமைந்துள்ளது?", options: ["(A) நைனிடால்", "(B) பீம்தால்", "(C) ஹால்த்வானி", "(D) ராணிக்கேத்"], ans: "(A)" },
        { q: "89. கத்யூரி மன்னரின் தலைநகரம்—", options: ["(A) கத்யூரி", "(B) பைஜ்நாத்", "(C) முசோரி", "(D) அல்மோரா"], ans: "(B)" },
        { q: "90. SEBI என்பது—", options: ["(A) சட்டப்பூர்வ அமைப்பு", "(B) ஆலோசனை அமைப்பு", "(C) அரசியலமைப்பு அமைப்பு", "(D) சட்டப்பூர்வமற்ற அமைப்பு"], ans: "(A)" },
        { q: "91. 2015 ஆம் ஆண்டு பாரிஸ் காலநிலை மாற்றம் ஒப்பந்தம், உலகளாவிய பசுமை இல்ல வாயு வெளியேற்றத்தையும் புவி வெப்பமடைதலையும் எந்த அளவிற்கு கீழே குறைப்பதற்கு இலக்கு நிர்ணயித்துள்ளது?", options: ["(A) 1°C", "(B) 2°C", "(C) 5°C", "(D) 7°C"], ans: "(B)" },
        { q: "92. காலநிலை மாற்றம் குறித்த பாரிஸ் ஒப்பந்தத்தின் கீழ் நாடுகள் தங்கள் தேசிய அளவில் நிர்ணயிக்கப்பட்ட தங்களின் பங்களிப்புகளை ஒவ்வொரு ___ வெளியிட வேண்டும்", options: ["(A) 3 ஆண்டும்", "(B) 4 ஆண்டும்", "(C) 5 ஆண்டும்", "(D) 8 ஆண்டும்"], ans: "(C)" },
        { q: "93. இந்திய அரசின் PM-KUSUM திட்டம் பற்றிய பின்வரும் கூற்றுகளில் எது சரியானதல்ல?\nI. PM-KUSUM என்பது பிரதான் மந்திரி கிசான் உர்ஜா சுரக்ஷா ஏவம் உத்தன் மகாபியான் (PM-KUSUM) என்பதன் சுருக்கமாகும்.\nII. இந்தத் திட்டம் விவசாயிகளுக்கு சூரிய சக்தி பம்புகள் மற்றும் மின் உற்பத்தி நிலையங்களை நிறுவுவதற்கு நிதி உதவி வழங்குகிறது.\nIII. இந்தத் திட்டம் 2019 ஆம் ஆண்டு வேளாண் அமைச்சகத்தால் தொடங்கப்பட்டது.", options: ["(A) I மற்றும் II சரியானவை", "(B) II மற்றும் III சரியானவை", "(C) I மற்றும் III சரியானவை", "(D) அனைத்தும் சரியானவை"], ans: "(A)" },
        { q: "94. அரசுப் பள்ளிகளில் இசை மற்றும் நடனக் கல்வியை மேம்படுத்துவதற்காக சமீபத்தில் எந்த மாநிலம்/யூனியன் பிரதேசம் 'இசை குடில் திட்டம்' தொடங்கியது?", options: ["(A) புதுச்சேரி", "(B) அசாம்", "(C) லட்சத்தீவுகள்", "(D) மிசோரம்"], ans: "(A)" },
        { q: "95. சமீபத்தில் செய்திகளில் காணப்பட்ட 'ஓபியோகார்டிசெப்ஸ் யூனிட.லேட்டரலிஸ்' என்றால் என்ன?", options: ["(A) பாக்டீரியா", "(B) மீன்", "(C) வைரஸ்", "(D) பூஞ்சை"], ans: "(D)" },
        { q: "96. சௌரா பழங்குடியினர் எந்த மாநிலத்தில் பெரும்பாண்மையாக வசிக்கின்றனர்?", options: ["(A) ஹரியானா", "(B) பீகார்", "(C) ஜார்கண்ட்", "(D) ஒடிசா"], ans: "(D)" },
        { q: "97. சமீபத்தில், இந்திய மத்திய அமைச்சரவையால் டிஜிட்டல் வேளாண்மை திட்டத்திற்கு எவ்வளவு நிதி அங்கீகரிக்கப்பட்டுள்ளது?", options: ["(A) ரூ.500 கோடி", "(B) ரூ.2,500 கோடி", "(C) ரூ.2,817 கோடி", "(D) ரூ.1,500 கோடி"], ans: "(C)" },
        { q: "98. சமீபத்தில், “இந்தியப் பெருங்கடல் பல்லுயிர் தகவல் அமைப்பு (IndoBIS)” குறித்த தேசிய அளவிலான கருத்தரங்கு எங்கு நடத்தப்பட்டது?", options: ["(A) தேசிய கடல்சார் நிறுவனம், கோவா", "(B) இந்திய தேசிய கடல்சார் தகவல் சேவை மையம், ஹைதராபாத்", "(C) கடல்சார் வாழ்க்கை வளங்கள் மற்றும் சூழலியல் மையம் (CMLRE), கொச்சி", "(D) மத்திய கடல்சார் மீன்வள ஆராய்ச்சி நிறுவனம், கொச்சி"], ans: "(C)" },
        { q: "99. சமீபத்தில், எந்த அமைச்சகம் ‘விஸ்வஸ்ய-பிளாக்செயின் தொழில்நுட்ப அடுக்கினை அறிமுகப்படுத்தியுள்ளது?", options: ["(A) மின்னணுவியல் மற்றும் தகவல் தொழில்நுட்ப அமைச்சகம்", "(B) புதிய மற்றும் புதுப்பிக்கத்தக்க எரிசக்தி அமைச்சகம்", "(C) நகர்ப்புற மேம்பாட்டு அமைச்சகம்", "(D) பாதுகாப்பு அமைச்சகம்"], ans: "(A)" },
        { q: "100. முதல் ‘சர்வதேச சூரிய ஒளி விழா’ எங்கு ஏற்பாடு செய்யப்பட்டது?", options: ["(A) ஜெய்ப்பூர்", "(B) போபால்", "(C) புது தில்லி", "(D) லக்னோ"], ans: "(C)" }
    ];

    let currentIndex = 0;

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';

        questionsData.forEach((qData, index) => {
            const card = document.createElement('div');
            card.className = `question-card ${index === 0 ? 'active' : ''}`;
            card.id = `question-${index}`;

            const qTitle = document.createElement('div');
            qTitle.className = 'question-title';
            qTitle.innerText = qData.q;
            card.appendChild(qTitle);

            const optionsList = document.createElement('ul');
            optionsList.className = 'options-list';

            qData.options.forEach((optText, optIdx) => {
                const li = document.createElement('li');
                li.className = 'option-item';

                const label = document.createElement('label');
                label.className = 'option-label';

                const radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = `q_${index}`;
                radio.value = optText;
                radio.onchange = () => revealAnswer(index);

                label.appendChild(radio);
                label.appendChild(document.createTextNode(' ' + optText));
                li.appendChild(label);
                optionsList.appendChild(li);
            });

            card.appendChild(optionsList);

            const ansBox = document.createElement('div');
            ansBox.className = 'answer-box';
            ansBox.id = `answer-${index}`;
            ansBox.innerText = `பதில் : ${qData.ans}`;
            card.appendChild(ansBox);

            container.appendChild(card);
        });

        updateNav();
    }

    function revealAnswer(index) {
        const ansBox = document.getElementById(`answer-${index}`);
        if (ansBox) {
            ansBox.style.display = 'block';
        }
    }

    function navigate(direction) {
        const currentCard = document.getElementById(`question-${currentIndex}`);
        currentCard.classList.remove('active');

        currentIndex += direction;

        const nextCard = document.getElementById(`question-${currentIndex}`);
        nextCard.classList.add('active');

        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentIndex === 0;
        document.getElementById('next-btn').disabled = currentIndex === questionsData.length - 1;
        document.getElementById('page-indicator').innerText = `Question ${currentIndex + 1} of ${questionsData.length}`;
    }

    // Disable copy shortcuts
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C' || e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
            e.preventDefault();
        }
    });

    window.onload = renderQuiz;
</script>
